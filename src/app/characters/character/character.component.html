<div class="characterContainer flex aic jcc fh p10 gap20">
  @if (!charactersService.characterLoaded) {
    <div class="spinner"></div>
  } @else {
    @if (charactersService.character$ | async; as character) {
      <div class="characterPreview fh flex aic jcc">
        <img #imgElement [class.error]="imgElement.dataset['error'] === 'true'" (error)="imgElement.dataset['error'] = 'true'" class="fw fh" [src]="'https://genshin.jmp.blue'+'/characters/'+characterName+'/gacha-splash'">
        @if(imgElement.dataset['error'] === 'true') {
          <span>Pas d'image pour ce personnage</span>
        }
      </div>
      <div class="basicInformation fh fw">
        <span class="characterName">{{character.name}}</span>

        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="40px" fill="white" viewBox="0 0 24 24"><path d="M11.5,0.5C12,0.75 13,2.4 13,3.5C13,4.6 12.33,5 11.5,5C10.67,5 10,4.85 10,3.75C10,2.65 11,2 11.5,0.5M18.5,9C21,9 23,11 23,13.5C23,15.06 22.21,16.43 21,17.24V23H12L3,23V17.24C1.79,16.43 1,15.06 1,13.5C1,11 3,9 5.5,9H10V6H13V9H18.5M12,16A2.5,2.5 0 0,0 14.5,13.5H16A2.5,2.5 0 0,0 18.5,16A2.5,2.5 0 0,0 21,13.5A2.5,2.5 0 0,0 18.5,11H5.5A2.5,2.5 0 0,0 3,13.5A2.5,2.5 0 0,0 5.5,16A2.5,2.5 0 0,0 8,13.5H9.5A2.5,2.5 0 0,0 12,16Z" /></svg>
          <span> Date de naissance : {{character.birthday | date:'dd MMMM'}}</span>
        </div>
        
      </div>
    }
  }
</div>
